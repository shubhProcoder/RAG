# ═══════════════════════════════════════════════════════════════════
# PDF RAG Application — Docker Compose
# ═══════════════════════════════════════════════════════════════════

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - ../.env
    environment:
      - DATA_DIR=/app/data
    volumes:
      - app-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  app-data:
    driver: local
